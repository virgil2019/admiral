bot_token: "123456:ABC-your-tg-bot-token"
allowed_tg_user_ids: [111222333]

session:
  tg_chat_id: 111222333
  # MUST equal sanitize(launch.bootstrap_task). For the example below,
  # "vibe bridge session" sanitizes to "vibe-bridge-session".
  team_name: "vibe-bridge-session"
  cwd: "/Users/georgehuang/Program/vibe-project"
  # provider: which team-cli to drive.
  #   "omx" (default) — uses the await-event long-poll stream.
  #   "omc"           — no await-event; bridge falls back to mailbox polling.
  provider: "omx"
  # Path to the team-cli binary that matches `provider`.
  cli_bin_path: "/usr/local/bin/omx"
  # Deprecated: omx_bin_path is still accepted as an alias for cli_bin_path
  # and logs a WARN deprecation notice on boot. Will be removed in a future
  # release.
  # leader_worker: which worker plain-text TG messages get routed to and
  # which worker shutdown requests target. Defaults are provider-specific:
  #   omx → "leader-fixed" (the virtual dispatcher worker)
  #   omc → "worker-1"     (omc's first concrete worker — leader-fixed has
  #                         no live agent in omc and would silently drop)
  # leader_worker: "worker-1"

launch:
  # "pty" | "direct". Used by the omx provider only.
  # Defaults: omx → "pty" on darwin, "direct" elsewhere.
  # The omc provider IGNORES this and launch.pty_command — it always
  # allocates a real PTY via creack/pty so `omc team`'s tmux send-keys
  # setup completes before the child sees stdin EOF.
  mode: "pty"
  # Only used when mode=pty under the omx provider.
  pty_command: ["/usr/bin/script", "-q", "/dev/null"]
  # The N in "<bin> team N:agent-type". Worker panes spawned.
  worker_count: 3
  # codex | claude | gemini
  agent_type: "codex"
  # Free-form task description passed to team launch. The team name is
  # DERIVED from this via the team-cli's sanitize rule (lowercase, non-alnum
  # collapsed to "-", trimmed, max 30 chars). session.team_name MUST equal
  # that derived form or the bridge refuses to boot.
  bootstrap_task: "vibe bridge session"

storage:
  sqlite_path: "~/.local/share/admiral/bridge.db"

telegram:
  long_poll_timeout_s: 50
  api_base: "https://api.telegram.org"

event_stream:
  # await_timeout_ms is omx-only (await-event long-poll). Ignored for omc.
  await_timeout_ms: 30000
  # idle_backoff_ms also drives the omc polling loop tick interval.
  idle_backoff_ms: 2000

logging:
  level: "info"
  file: "~/.local/share/admiral/bridge.log"

# admiral-autopilot (v0.3): Linear-driven autopilot daemon. Both linear and
# autopilot blocks are required only when running `admiral-autopilot`; the
# TG bridge ignores them.
#
# Prereq: a Linear OAuth app installed as an Agent (actor=app, scopes
# include app:mentionable + app:assignable), with a webhook subscribed to
# "Agent session events". `oauth-callback.ts`-style flows are typical.
linear:
  # OAuth access token (lin_oauth_*) for the agent install, or a personal
  # API key (lin_api_*). Both work — Bearer is added automatically.
  api_token: "lin_oauth_xxxxxxxx"
  # Webhook signing secret (app's Webhooks section, "Signing secret" field).
  webhook_secret: "lin_wh_xxxxxxxx"
  # api_base: "https://api.linear.app/graphql"  # default
  # OAuth client ID and secret — required for automatic token refresh.
  # If absent, token refresh is unavailable (v0.3 fallback).
  # client_id: "lin_oauth_client_id"
  # client_secret: "lin_oauth_client_secret"
  # redirect_uri: "http://127.0.0.1:8080/callback"  # must match Linear OAuth app config
  # Refresh token from the initial OAuth flow — stored in SQLite and
  # used automatically when the access token expires.
  # refresh_token: "lin_oauth_refresh_token"

autopilot:
  # HTTP bind address for the webhook receiver. Default: ":8787"
  listen_addr: ":8787"

  # Admin API/UI HTTP bind. Default: "127.0.0.1:8788" (localhost only).
  # Change to ":8788" to bind on all interfaces (exposes admin UI externally).
  admin_listen_addr: "127.0.0.1:8788"

  # Static bearer token for admin API and admin UI login. Required for the
  # admin server to start. If unset a transient token is generated on each
  # boot (logged to stderr) — set a persistent value in production.
  # Can also be set via ADMIRAL_ADMIN_TOKEN env var (env takes priority).
  # admin_token: "change-me"

  # Repo routing: each Linear *project* maps to exactly one repo. An incoming
  # Linear issue is routed by its project_id; issues without a project
  # assigned are rejected (no fallback). If one logical product spans
  # multiple repos, create one Linear project per repo and let issues live
  # in the project that matches the repo they touch.
  #
  # Tip — finding a project UUID: Linear's web URL only exposes a slug, not
  # the UUID. Use the GraphQL API (or the Linear MCP `list_projects` tool)
  # to fetch full UUIDs:
  #   query { projects { nodes { id name } } }
  repos:
    - project_id: "00000000-0000-0000-0000-000000000000"  # Linear project UUID
      project_name: "Admiral"                              # log/UI only
      repo_dir: "/home/you/code/your-repo"
      base_branch: "main"
    # - project_id: "11111111-1111-1111-1111-111111111111"
    #   project_name: "AnotherProject"
    #   repo_dir: "/home/you/code/another-repo"
    #   base_branch: "main"

  # Defaults shown:
  # worktree_root:   ".worktrees"
  # claude_bin:      "claude"
  # gh_bin:          "gh"
  # autopilot_skill: ""           # claude skill name, e.g. "autopilot"
  # max_run_seconds: 1800
  # job_streams_dir: "<sqlite_path dir>/job-streams"
  #                  # Directory for per-job claude stream-json log files.
  #                  # Each job writes one .jsonl file named <session_id>.jsonl.
  #                  # Default is derived from storage.sqlite_path:
  #                  # e.g. ~/.local/share/admiral/job-streams
  # worker_count: 3   # max concurrent issues admiral processes; same-session events stay serialized
