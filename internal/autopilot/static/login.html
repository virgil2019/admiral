<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Admiral</title>
<link rel="stylesheet" href="/admin/ui/login.css">
</head>
<body>
<div class="login-container">
  <h1>Admiral Admin</h1>
  <p>Enter your admin token to continue.</p>
  <form id="login-form">
    <input type="password" id="token" name="token" placeholder="Admin token" required autocomplete="current-password">
    <button type="submit">Sign In</button>
  </form>
  <p id="error" class="error hidden"></p>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var token = document.getElementById('token').value;
  if (!token) return;

  // Set cookie (HttpOnly, Secure=false for localhost dev compatibility)
  var expires = new Date();
  expires.setTime(expires.getTime() + 24 * 60 * 60 * 1000); // 24 hours
  document.cookie = 'admiral_admin=' + encodeURIComponent(token) +
    '; path=/; HttpOnly; SameSite=Lax' +
    '; expires=' + expires.toUTCString();

  // Redirect to dashboard
  window.location.href = '/admin/ui/';
});
</script>
</body>
</html>
