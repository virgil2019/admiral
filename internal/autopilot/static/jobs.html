<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs – Admiral</title>
<link rel="stylesheet" href="/admin/ui/style.css">
<script src="/admin/ui/htmx.min.js"></script>
</head>
<body>
<nav>
  <a href="/admin/ui/">Dashboard</a>
  <a href="/admin/ui/repos">Repos</a>
  <a href="/admin/ui/jobs">Jobs</a>
</nav>
<main>
  <h1>Jobs</h1>

  <form hx-get="/admin/ui/_partial/jobs_table" hx-trigger="submit" hx-swap="innerHTML" hx-target="#jobs-table">
    <label>State:
      <select name="status">
        <option value="">All</option>
        <option value="RECEIVED">RECEIVED</option>
        <option value="EXECUTING">EXECUTING</option>
        <option value="DONE">DONE</option>
        <option value="FAILED">FAILED</option>
        <option value="TIMED_OUT">TIMED_OUT</option>
        <option value="DONE_THREAD_INCONSISTENT">DONE_THREAD_INCONSISTENT</option>
      </select>
    </label>
    <input name="team_id" placeholder="Team ID">
    <button type="submit">Filter</button>
  </form>

  <div id="jobs-table" hx-get="/admin/ui/_partial/jobs_table" hx-trigger="load" hx-swap="innerHTML">
    <p>Loading...</p>
  </div>
</main>
<div id="toast" class="toast hidden"></div>
<script>
document.body.addEventListener('htmx:afterRequest', function(evt) {
  if (evt.detail.xhr.status >= 400) {
    var toast = document.getElementById('toast');
    try {
      var body = JSON.parse(evt.detail.xhr.responseText);
      toast.textContent = body.error || 'Error: ' + evt.detail.xhr.status;
    } catch(e) {
      toast.textContent = 'Error: ' + evt.detail.xhr.status;
    }
    toast.classList.remove('hidden');
    setTimeout(function() { toast.classList.add('hidden'); }, 4000);
  }
});
</script>
</body>
</html>
